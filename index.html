<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic 2D Top-Down RPG Engine</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        
        body {
            background: #222;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Classic Game Boy Style Screen Viewport */
        .game-screen {
            position: relative;
            width: 512px;
            height: 448px;
            background: #8bac0f; /* Retro green tint background */
            border: 8px solid #333;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        /* 2D Flat Top-Down Map Grid (No 3D Tilting) */
        .rpg-map {
            position: absolute;
            width: 512px;
            height: 320px;
            display: grid;
            grid-template-columns: repeat(8, 64px);
            grid-template-rows: repeat(5, 64px);
        }

        /* Map World Grass Tiles */
        .tile {
            width: 64px;
            height: 64px;
            background: #9bbc0f;
            border: 1px solid #8bac0f;
            image-rendering: pixelated; /* Keeps pixel art sharp if using images */
        }
        /* Create alternate tile shades to mimic retro texture patterns */
        .tile:nth-child(3n) { background: #8bac0f; }

        /* Controllable 2D Character Sprite Block */
        .player-sprite {
            position: absolute;
            width: 48px;
            height: 48px;
            background: #306230; /* Dark green placeholder block */
            border: 3px solid #0f380f;
            border-radius: 4px;
            left: 0px;
            top: 0px;
            /* Center the sprite nicely inside its current 64px tile path */
            margin-left: 8px;
            margin-top: 8px;
            transition: left 0.1s cubic-bezier(0.25, 1, 0.5, 1), top 0.1s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 10;
        }

        /* Iconic RPG Text Dialogue Box Layout */
        .dialogue-box {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 128px;
            background: #ffffff;
            border-top: 6px double #0f380f;
            padding: 16px;
            color: #0f380f;
            font-weight: bold;
            font-size: 18px;
            line-height: 1.4;
        }

        .hud-tip {
            font-size: 12px;
            margin-top: 8px;
            color: #888;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- Retro Game Engine Viewport Container -->
    <div class="game-screen">
        
        <!-- 2D Overworld Map Grid View -->
        <div class="rpg-map" id="world-map"></div>
        
        <!-- Player Sprite Character Instance -->
        <div id="hero" class="player-sprite"></div>

        <!-- Classic Bottom Dialogue Display Window -->
        <div class="dialogue-box">
            <div id="text-feed">SENSEIEGG started a new trial adventure!</div>
            <div class="hud-tip">[WASD keys to walk around map]</div>
        </div>

    </div>

    <script>
        // Draw standard 8x5 map grid structure programmatically
        const mapContainer = document.getElementById('world-map');
        for (let i = 0; i < 40; i++) {
            const block = document.createElement('div');
            block.classList.add('tile');
            mapContainer.appendChild(block);
        }

        const hero = document.getElementById('hero');
        const textFeed = document.getElementById('text-feed');

        // Track standard cell coordinate indices directly
        let gridX = 0; // Boundary range: 0 to 7 chunks horizontally
        let gridY = 0; // Boundary range: 0 to 4 chunks vertically
        const stepSize = 64; // Distance step increment matches tile size dimensions exactly

        // Array of randomized flavor text alert updates to cycle through on footsteps
        const travelQuotes = [
            "You walked into some tall grass... Nothing appeared.",
            "A cozy breeze blows past your pixelated face.",
            "You found a hidden item signpost! It reads: 'Keep Coding!'",
            "Your UI/UX design internship entry details look promising!",
            "You hear familiar retro 8-bit chiptune melodies playing nearby."
        ];

        function renderMovement() {
            // Keep player firmly bounded within active viewport screen dimensions
            gridX = Math.max(0, Math.min(7, gridX));
            gridY = Math.max(0, Math.min(4, gridY));

            hero.style.left = (gridX * stepSize) + 'px';
            hero.style.top = (gridY * stepSize) + 'px';
        }

        // Intercept WASD presses and route movement steps directly across the grid axis
        window.addEventListener('keydown', (event) => {
            const activeKey = event.key.toLowerCase();
            let moved = false;

            if (activeKey === 'w') { gridY -= 1; moved = true; }
            if (activeKey === 's') { gridY += 1; moved = true; }
            if (activeKey === 'a') { gridX -= 1; moved = true; }
            if (activeKey === 'd') { gridX += 1; moved = true; }

            if (moved) {
                renderMovement();
                // Randomly display classic script updates inside the text log box
                if (Math.random() > 0.6) {
                    const randomMessage = travelQuotes[Math.floor(Math.random() * travelQuotes.length)];
                    textFeed.innerText = randomMessage;
                }
            }
        });

        // Run starter render on setup initialization
        renderMovement();
    </script>
</body>
</html>
