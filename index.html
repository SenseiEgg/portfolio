<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Art 3D Gallery Frame</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050508;
            font-family: 'Courier New', Courier, monospace;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        .ui-overlay {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.7);
            font-size: 0.9rem;
            pointer-events: none;
            letter-spacing: 2px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            z-index: 10;
        }
    </style>
    <!-- Include Three.js and OrbitControls from CDN -->
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <div id="canvas-container"></div>
    <div class="ui-overlay">DRAG TO ROTATE • SCROLL TO ZOOM</div>

    <script>
        // --- 1. SETUP THE 3D SCENE & RENDERER ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0f);
        scene.fog = new THREE.FogExp2(0x0a0a0f, 0.15); // Adds subtle dark atmosphere

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping; // AAA Game Cinematic Tone Mapping
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 + 0.1; // Don't let camera go below ground

        // --- 2. CINEMATIC WARM LIGHTING SETUP ---
        // Ambient soft bounce light
        const ambientLight = new THREE.AmbientLight(0xfff3e0, 0.15);
        scene.add(ambientLight);

        // Warm Dramatic Overhead Gallery Spotlight
        const spotLight = new THREE.SpotLight(0xffaa44, 12); // High intensity golden glow
        spotLight.position.set(0, 5, 4);
        spotLight.angle = Math.PI / 4;
        spotLight.penumbra = 0.8; // Soft feathered light edges
        spotLight.castShadow = true;
        spotLight.shadow.mapSize.width = 2048;
        spotLight.shadow.mapSize.height = 2048;
        spotLight.shadow.bias = -0.001;
        scene.add(spotLight);

        // Soft rim fill light from the side
        const fillLight = new THREE.DirectionalLight(0x4466ff, 0.8); // Cool blue contrast rim
        fillLight.position.set(-5, 2, -2);
        scene.add(fillLight);

        // --- 3. BUILD THE HYPER-REALISTIC FRAME ---
        const galleryGroup = new THREE.Group();

        // Concrete Gallery Wall Backdrop
        const wallGeo = new THREE.PlaneGeometry(30, 20);
        const wallMat = new THREE.MeshStandardMaterial({ 
            color: 0x1c1c22, 
            roughness: 0.8,
            metalness: 0.1
        });
        const wall = new THREE.Mesh(wallGeo, wallMat);
        wall.position.z = -0.5;
        wall.receiveShadow = true;
        galleryGroup.add(wall);

        // Heavy Wooden Outer Frame Profile
        const frameWidth = 4.4;
        const frameHeight = 4.4;
        const frameDepth = 0.4;
        const borderThickness = 0.3;

        const frameGroup = new THREE.Group();

        // Custom wood shader configuration for organic dark oak texture look
        const woodMaterial = new THREE.MeshStandardMaterial({
            color: 0x2b1d14, 
            roughness: 0.5,
            metalness: 0.2,
            bumpScale: 0.05
        });

        // Top/Bottom bars
        const horizontalBarGeo = new THREE.BoxGeometry(frameWidth, borderThickness, frameDepth);
        const topBar = new THREE.Mesh(horizontalBarGeo, woodMaterial);
        topBar.position.y = (frameHeight / 2) - (borderThickness / 2);
        topBar.castShadow = true;
        
        const bottomBar = topBar.clone();
        bottomBar.position.y = -((frameHeight / 2) - (borderThickness / 2));

        // Left/Right bars
        const verticalBarGeo = new THREE.BoxGeometry(borderThickness, frameHeight - (borderThickness * 2), frameDepth);
        const leftBar = new THREE.Mesh(verticalBarGeo, woodMaterial);
        leftBar.position.x = -((frameWidth / 2) - (borderThickness / 2));
        leftBar.castShadow = true;

        const rightBar = leftBar.clone();
        rightBar.position.x = ((frameWidth / 2) - (borderThickness / 2));

        frameGroup.add(topBar, bottomBar, leftBar, rightBar);

        // White Passe-partout (Matte Board border)
        const matteGeo = new THREE.BoxGeometry(frameWidth - 0.2, frameHeight - 0.2, 0.1);
        const matteMaterial = new THREE.MeshStandardMaterial({ color: 0xefefe9, roughness: 0.9 });
        const matte = new THREE.Mesh(matteGeo, matteMaterial);
        matte.position.z = -0.1;
        matte.receiveShadow = true;
        frameGroup.add(matte);

        // Protective Glass Overlay (Adds realistic glare reflections)
        const glassGeo = new THREE.PlaneGeometry(frameWidth - borderThickness*2, frameHeight - borderThickness*2);
        const glassMaterial = new THREE.MeshPhysicalMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.2,
            roughness: 0.05,
            metalness: 0.1,
            transmission: 0.9, // Passes light through cleanly
            ior: 1.5, // Index of refraction for realistic glass shine
            side: THREE.DoubleSide
        });
        const glass = new THREE.Mesh(glassGeo, glassMaterial);
        glass.position.z = 0.06;
        frameGroup.add(glass);

        // --- 4. TEXTURE LOADING & PIXEL-ART CORRECTION ---
        const textureLoader = new THREE.TextureLoader();
        
        // IMPORTANT: Once you export your .piskel to PNG, replace this filename with your uploaded file!
        const artTexture = textureLoader.load('frog1.png', function(texture) {
            // CRITICAL SCRIPT ENGINE RULES: Fixes small unresized pixel art blurring!
            texture.minFilter = THREE.NearestFilter;
            texture.magFilter = THREE.NearestFilter;
            texture.generateMipmaps = false;
        });

        const artGeo = new THREE.PlaneGeometry(3.2, 3.2);
        const artMaterial = new THREE.MeshStandardMaterial({ 
            map: artTexture,
            roughness: 0.7,
            transparent: true // Retains layer transparency safely
        });
        const artMesh = new THREE.Mesh(artGeo, artMaterial);
        artMesh.position.z = 0.02; // Sits just over the white matte
        artMesh.castShadow = true;
        frameGroup.add(artMesh);

        scene.add(frameGroup);
        scene.add(galleryGroup);

        // Make the spotlight trace the frame slightly
        spotLight.target = frameGroup;

        // --- 5. ANIMATION LOOP & RESPONSIVENESS ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            
            // Subtle breathing idle animation for dramatic shadows
            const time = Date.now() * 0.001;
            spotLight.position.x = Math.sin(time * 0.5) * 0.5;
            
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', onWindowResize, false);

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        animate();
    </script>
</body>
</html>
