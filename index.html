<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full-Screen 2D RPG Action Engine</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        
        body, html {
            width: 100%;
            height: 100%;
            background: #111;
            overflow: hidden;
            position: relative;
        }

        /* Full Screen Playable Overworld Canvas */
        .rpg-world {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: calc(100vh - (100vh / 15)); /* Reserves exactly 1/15th for the taskbar */
            background: #4a7c59; /* Classic RPG grass green background */
            background-image: 
                radial-gradient(rgba(0,0,0,0.08) 15%, transparent 16%),
                radial-gradient(rgba(0,0,0,0.05) 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
        }

        /* Player Character Sprite Block */
        .player-sprite {
            position: absolute;
            width: 40px;
            height: 40px;
            background: #2b5c8f; /* Blue Hero Block */
            border: 3px solid #1a3a5f;
            border-radius: 6px;
            z-index: 10;
            box-shadow: 0 6px 10px rgba(0,0,0,0.3);
            transition: left 0.1s linear, top 0.1s linear;
        }

        /* Bow and Arrow Weapon Graphic Overlay attached to Hero */
        .bow-attachment {
            position: absolute;
            right: -10px;
            top: 12px;
            width: 6px;
            height: 16px;
            background: #8b5a2b; /* Wooden bow indicator */
            border-radius: 50%;
            border-left: 2px solid #fff; /* String link line */
        }

        /* Dynamic Spawned Enemy Target Objects */
        .enemy {
            position: absolute;
            width: 36px;
            height: 36px;
            background: #b23b3b; /* Red Aggro Entity Block */
            border: 3px solid #5c1a1a;
            border-radius: 4px;
            z-index: 5;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: all 0.2s ease;
        }

        /* Projectile Arrow Node Elements */
        .arrow {
            position: absolute;
            width: 16px;
            height: 4px;
            background: #ddd;
            border-top: 1px solid #333;
            border-bottom: 1px solid #333;
            z-index: 8;
        }

        /* Taskbar Box Element taking up exactly 1/15th of the window height */
        .game-taskbar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100vw;
            height: calc(100vh / 15);
            background: #f4f4f4;
            border-top: 4px double #333;
            padding: 0 20px;
            color: #222;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 14px;
            z-index: 100;
        }

        .log-feed {
            color: #c0392b;
            font-size: 15px;
            flex-grow: 1;
            margin-left: 30px;
        }

        .controls-legend {
            font-size: 11px;
            color: #666;
            text-align: right;
        }
    </style>
</head>
<body>

    <!-- Playable Arena Layer -->
    <div class="rpg-world" id="world">
        <!-- Player Entity with Equipped Bow -->
        <div id="player" class="player-sprite">
            <div class="bow-attachment"></div>
        </div>
    </div>

    <!-- Taskbar Footer Monitor -->
    <div class="game-taskbar">
        <div>🏹 WEAPON: ACTIVE BOW</div>
        <div class="log-feed" id="status-text">SYSTEM: An enemy camp spawned across the fields!</div>
        <div class="controls-legend">⚡ [WASD] Move | [SPACEBAR] Shoot Right</div>
    </div>

    <script>
        const world = document.getElementById('world');
        const player = document.getElementById('player');
        const statusText = document.getElementById('status-text');

        // Dynamic Position Bounds Management
        let pX = 100; 
        let pY = 100;
        const moveSpeed = 25;

        // Tracks active array lists for runtime rendering loops
        let enemiesArray = [];
        let arrowsArray = [];

        function updatePlayerPlacement() {
            // Read active screen window sizes dynamically
            const maxWidth = window.innerWidth - 45;
            const maxHeight = (window.innerHeight - (window.innerHeight / 15)) - 45;

            pX = Math.max(10, Math.min(maxWidth, pX));
            pY = Math.max(10, Math.min(maxHeight, pY));

            player.style.left = pX + 'px';
            player.style.top = pY + 'px';
        }

        // Programmatic Enemy Factory Spawner
        function spawnTargetEnemy() {
            const enemyNode = document.createElement('div');
            enemyNode.classList.add('enemy');
            
            // Generate random plot coordinates avoiding the header edges
            const spawnX = Math.floor(Math.random() * (window.innerWidth - 100)) + 50;
            const spawnY = Math.floor(Math.random() * ((window.innerHeight - (window.innerHeight / 15)) - 100)) + 50;
            
            enemyNode.style.left = spawnX + 'px';
            enemyNode.style.top = spawnY + 'px';
            
            world.appendChild(enemyNode);
            enemiesArray.push({ element: enemyNode, x: spawnX, y: spawnY });
        }

        // Arrow Mechanics Logic Function
        function fireArrow() {
            const arrowNode = document.createElement('div');
            arrowNode.classList.add('arrow');
            
            // Set launch origins pointing adjacent to player node space
            let aX = pX + 40;
            let aY = pY + 18;
            
            arrowNode.style.left = aX + 'px';
            arrowNode.style.top = aY + 'px';
            world.appendChild(arrowNode);

            statusText.innerText = "ACTION: Arrow launched straight ahead!";

            const arrowInterval = setInterval(() => {
                aX += 12;
                arrowNode.style.left = aX + 'px';

                // Hit Detection Collision Validation Sweep
                enemiesArray.forEach((enemyObj, index) => {
                    if (aX >= enemyObj.x && aX <= enemyObj.x + 36 &&
                        aY >= enemyObj.y && aY <= enemyObj.y + 36) {
                        
                        // Execute strike cleanups
                        enemyObj.element.remove();
                        enemiesArray.splice(index, 1);
                        arrowNode.remove();
                        clearInterval(arrowInterval);
                        
                        statusText.innerText = "SUCCESS: Enemy struck down cleanly! Target eliminated.";
                        
                        // Respawn new replacement challenge targets automatically
                        setTimeout(spawnTargetEnemy, 1500);
                    }
                });

                // Garbage cleanup for offscreen assets
                if (aX > window.innerWidth) {
                    arrowNode.remove();
                    clearInterval(arrowInterval);
                }
            }, 20);
        }

        // Active Key Capture Bindings
        window.addEventListener('keydown', (e) => {
            const input = e.key.toLowerCase();
            
            if (input === 'w') pY -= moveSpeed;
            if (input === 's') pY += moveSpeed;
            if (input === 'a') pX -= moveSpeed;
            if (input === 'd') pX += moveSpeed;
            
            if (e.key === ' ' || e.code === 'Space') {
                e.preventDefault(); // Prevents page from jumping down on spacebar
                fireArrow();
            }

            updatePlayerPlacement();
        });

        // Initialize setup loops
        updatePlayerPlacement();
        for(let i=0; i < 5; i++) { spawnTargetEnemy(); } // Pre-populates field with 5 targets immediately
    </script>
</body>
</html>
